---
layout: default
---
<article class="post">
  <p class="eyebrow">{{ page.date | date: "%d.%m.%Y" }}{% if page.tags %} — {{ page.tags | join: " / " }}{% endif %}</p>
  <h1 class="title">{{ page.title }}</h1>
  {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">← All writing</a></p>
</article>
