{% assign w = include.w %}
<figure class="tile">
  <a href="{% if w.link and w.link != '' %}{{ w.link }}{% else %}{{ w.image | relative_url }}{% endif %}">
    <div class="img{% if w.image %} has-img{% endif %}">
      {% if w.image %}
        <img src="{{ w.image | relative_url }}" alt="{{ w.alt | default: w.title }}" loading="lazy">
      {% else %}
        <span class="placeholder">Image to come</span>
      {% endif %}
    </div>
    <figcaption>
      <span class="name">{{ w.title }}</span>
      <span class="meta">{{ w.medium }}{% if w.year and w.year != "" %} · {{ w.year }}{% endif %}</span>
    </figcaption>
  </a>
</figure>
