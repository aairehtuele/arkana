---
layout: default
title: Projects
permalink: /projects/
---
<section class="page-head">
  <h1 class="title">Projects</h1>
  <p class="lede">Things I'm building, testing or thinking about, in and outside the lab.</p>
</section>

<section class="index">
  <ol class="list pubs">
    {% for p in site.data.projects %}
    <li>
      <a href="{% if p.link != '' %}{{ p.link | relative_url }}{% else %}#{% endif %}">
        <span class="num">{{ p.year }}</span>
        <span class="name">{{ p.title }}<small>{{ p.description }}</small></span>
        <span class="meta">{{ p.status }}</span>
      </a>
    </li>
    {% endfor %}
  </ol>
</section>
